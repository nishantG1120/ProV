.core{position:absolute;left:38%;top:30%;width:24%;height:52%;border-radius:50%;
 background:radial-gradient(closest-side,rgba(120,220,255,.55),rgba(60,160,255,.18) 55%,transparent);
 mix-blend-mode:screen;animation:pulse 3.6s ease-in-out infinite;pointer-events:none}
.halo{position:absolute;left:24%;top:62%;width:52%;height:22%;border-radius:50%;
 background:radial-gradient(closest-side,rgba(184,255,60,.35),rgba(65,210,255,.15) 60%,transparent);
 mix-blend-mode:screen;animation:pulse 3.6s ease-in-out infinite -1.8s;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.85}}
.vault{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scr{mix-blend-mode:screen}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 1.5s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{0%{transform:scale(.05);opacity:1}100%{transform:scale(1);opacity:0}}
.tile{position:absolute;height:auto}
.bob{position:relative;animation:float 6s ease-in-out infinite var(--d);will-change:transform}
.bob img{display:block;width:100%;height:auto;animation:glow 6s ease-in-out infinite var(--d)}
.shine{position:absolute;inset:0;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
 background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,0) 42%,rgba(220,250,255,.75) 50%,rgba(255,255,255,0) 58%,transparent 62%) no-repeat;
 background-size:300% 100%;background-position:150% 0;mix-blend-mode:screen;
 animation:sweep 4.8s cubic-bezier(.45,.05,.35,1) infinite var(--sd)}
@keyframes float{0%,100%{transform:translate3d(0,0,0) rotate(0deg)}50%{transform:translate3d(0,-2.2%,0) rotate(-.6deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(65,210,255,0)) brightness(1)}50%{filter:drop-shadow(0 0 10px rgba(65,210,255,.55)) brightness(1.12)}}
@keyframes sweep{0%{background-position:150% 0}45%,100%{background-position:-50% 0}}
.dot{position:absolute;bottom:18%;width:.35%;aspect-ratio:1;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);
 opacity:0;animation:rise 7s linear infinite;pointer-events:none}
.dot:nth-child(odd){background:var(--lime);box-shadow:0 0 6px var(--lime)}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-55vw);opacity:0}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:13px}
button{font:inherit;color:var(--fg);background:rgba(65,210,255,.12);border:1px solid rgba(65,210,255,.35);border-radius:999px;padding:6px 14px;cursor:pointer}
button:hover{background:rgba(65,210,255,.22)} button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
